name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URI: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_SECRET: ci-build-only-secret-do-not-use-outside-github-actions

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate Payload artifacts
        run: |
          npm run generate:types
          npm run generate:importmap

      - name: Verify generated artifacts are current
        run: git diff --exit-code

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
